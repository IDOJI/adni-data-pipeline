name: SNP source and synthetic validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  snp-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: SNP
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 04_workflow/snp.py doctor
      - run: python3 -m unittest discover -s 05_tests -v
