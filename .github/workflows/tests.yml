name: RS-fMRI compatibility tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: RS-fMRI
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            RS-fMRI/requirements.txt
            RS-fMRI/02-bids/post_clinica_qc/requirements.txt
            RS-fMRI/04-harmonization/fc_harmonization/requirements.txt
      - name: Install the DICOM converter for the synthetic acquisition test
        run: sudo apt-get update && sudo apt-get install -y dcm2niix
      - run: python support/setup.py
      - run: python -m pip install -r requirements.txt -r 02-bids/post_clinica_qc/requirements.txt -r 04-harmonization/fc_harmonization/requirements.txt
      - run: python support/workflow/lab.py doctor
      - run: python -m pytest -q
      - name: Test original utilities with synthetic inputs
        run: python -m pytest -q pipeline/utils/tests --deselect=pipeline/utils/tests/test_make_sample_size_table.py::test_repo_manifest_renders
